name: Verify server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify authorization, retention and schema migration
        working-directory: server
        run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate portable deployment configuration
        run: docker compose --env-file .env.example --profile production config --quiet
      - name: Build runtime image
        run: docker build -t ansim-link-ci .
      - name: Exercise health and local first-device setup
        run: |
          docker run --detach --name ansim-link-ci -e PUBLIC_BASE_URL=https://family.example.com -p 127.0.0.1:18080:8080 ansim-link-ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health
          docker exec ansim-link-ci node src/bootstrap.mjs
      - name: Remove isolated runtime and data
        if: always()
        run: docker rm --force --volumes ansim-link-ci
