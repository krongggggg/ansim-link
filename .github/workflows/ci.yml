name: Verify Eodit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify authorization, retention and schema migration
        working-directory: server
        run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR integrity before execution
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and AGP build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build keyless debug and unsigned release
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
        # No map/signing credentials or APK artifact upload. Keyless maps show setup guidance.

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate portable deployment configuration
        run: docker compose --env-file .env.example --profile production config --quiet
      - name: Build and wait for the deployed server to be healthy
        run: docker compose --env-file .env.example --project-name ansim-link-ci up --detach --build --wait --wait-timeout 90 server
      - name: Exercise health and local first-device setup
        run: |
          curl --fail http://127.0.0.1:8080/health
          docker compose --env-file .env.example --project-name ansim-link-ci exec -T server node src/bootstrap.mjs > /dev/null
      - name: Show server logs on failure
        if: failure()
        run: docker compose --env-file .env.example --project-name ansim-link-ci logs --no-color server
      - name: Remove isolated runtime and data
        if: always()
        run: docker compose --env-file .env.example --project-name ansim-link-ci down --volumes --remove-orphans
