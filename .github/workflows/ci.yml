name: Verify server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify authorization, retention and schema migration
        working-directory: server
        run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate portable deployment configuration
        run: docker compose --env-file .env.example --profile production config --quiet
      - name: Build and wait for the deployed server to be healthy
        run: docker compose --env-file .env.example --project-name ansim-link-ci up --detach --build --wait --wait-timeout 90 server
      - name: Exercise health and local first-device setup
        run: |
          curl --fail http://127.0.0.1:8080/health
          docker compose --env-file .env.example --project-name ansim-link-ci exec -T server node src/bootstrap.mjs
      - name: Show server logs on failure
        if: failure()
        run: docker compose --env-file .env.example --project-name ansim-link-ci logs --no-color server
      - name: Remove isolated runtime and data
        if: always()
        run: docker compose --env-file .env.example --project-name ansim-link-ci down --volumes --remove-orphans
